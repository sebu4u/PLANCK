name: Workshop Reminders

on:
  schedule:
    # Run every 5 minutes to catch 30m and 10m reminders
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger workshop reminders endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 60 \
            https://www.planck.academy/api/cron/workshop-reminders)
          
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
            echo "✅ Reminders triggered successfully (HTTP $HTTP_CODE)"
            exit 0
          else
            echo "❌ Reminders failed with HTTP $HTTP_CODE"
            exit 1
          fi
