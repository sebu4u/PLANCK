<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Resorturi în serie</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --text: #292929; --line: #e8e8ec; --accent: #8043f0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; }
    .sim { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
    .controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 2px; }
    .row { display: flex; align-items: center; gap: 6px; flex: 1 1 110px; min-width: 0; }
    .row label { font: 600 10px ui-sans-serif, system-ui, sans-serif; white-space: nowrap; }
    .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; }
    .val { font: 700 10px ui-sans-serif, system-ui, sans-serif; color: var(--accent); min-width: 32px; text-align: right; }
    .stage { flex: 1 1 auto; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(180deg, #fff 0%, #fbfbfb 100%); }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    @media (max-width: 520px) {
      .row { min-height: 32px; flex: 1 1 100%; }
      .row input[type=range] { height: 28px; }
      .stage { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="sim">
    <div class="controls">
      <div class="row"><label for="k1">k₁</label><input id="k1" type="range" min="20" max="300" step="5" value="90"><span class="val" id="k1Val">90</span></div>
      <div class="row"><label for="k2">k₂</label><input id="k2" type="range" min="20" max="300" step="5" value="90"><span class="val" id="k2Val">90</span></div>
      <div class="row"><label>k<sub>eq</sub></label><span class="val" id="keqVal">45</span></div>
    </div>
    <section class="stage"><canvas id="canvas"></canvas></section>
  </main>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const MASS = 1, BLOCK = 20, DAMPING = 5.5, WALL_W = 14, RESTITUTION = 0.42, JUNC_R = 5;
    let cssW = 0, cssH = 0, dpr = 1, paused = false;
    let k1 = 90, k2 = 90;
    let cy = 0, wallX = 0, restX = 0, L0 = 0;
    let ballX = 0, v = 0;
    let dragging = false, pointerId = null;

    function keq() { return 1 / (1 / k1 + 1 / k2); }
    function layout() {
      cy = cssH * 0.46;
      wallX = cssW * 0.07;
      L0 = Math.min(cssW * 0.42, 176);
      restX = wallX + WALL_W + L0 + BLOCK;
    }
    function minBallX() { return wallX + WALL_W + L0 * 0.38 + BLOCK; }
    function maxBallX() { return wallX + WALL_W + L0 * 1.85 + BLOCK; }
    function displacement() { return ballX - restX; }
    function fmtKeq() {
      const k = keq();
      return Math.abs(k - Math.round(k)) < 0.05 ? String(Math.round(k)) : k.toFixed(1);
    }
    function postState() {
      window.parent.postMessage({
        type: "learning-path-simulation-state",
        name: "Resorturi în serie",
        text: dragging ? "Trage cubul — seria e mai moale decât un singur resort k₁." : "Eliberează — k_eq = 1/(1/k₁+1/k₂), mai mic decât k₁.",
        paused
      }, "*");
    }
    function resize() {
      const r = canvas.getBoundingClientRect();
      cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(cssW * dpr); canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const rel = restX > 0 ? (ballX - restX) / L0 : 0;
      layout();
      ballX = Math.max(minBallX(), Math.min(maxBallX(), restX + rel * L0));
    }
    function ptr(e) {
      const rec = canvas.getBoundingClientRect();
      return { x: e.clientX - rec.left, y: e.clientY - rec.top };
    }
    function hitBlock(p) {
      return Math.abs(p.x - ballX) <= BLOCK + 10 && Math.abs(p.y - cy) <= BLOCK + 10;
    }
    function update(dt) {
      if (paused || dragging) return;
      const disp = displacement();
      const a = (-keq() * disp - DAMPING * v) / MASS;
      v += a * dt;
      ballX += v * dt;
      if (ballX < minBallX()) { ballX = minBallX(); v = Math.abs(v) * RESTITUTION; }
      else if (ballX > maxBallX()) { ballX = maxBallX(); v = -Math.abs(v) * RESTITUTION; }
      if (Math.abs(disp) < 0.3 && Math.abs(v) < 0.45) { v = 0; ballX = restX; }
    }
    function drawWall() {
      const top = cy - cssH * 0.26, bot = cy + cssH * 0.26;
      ctx.fillStyle = "#292929";
      ctx.fillRect(wallX, top, WALL_W, bot - top);
      ctx.fillStyle = "rgba(41,41,41,0.08)";
      for (let y = top + 10; y < bot; y += 18) ctx.fillRect(wallX - 8, y, 8, 2);
    }
    function drawCoil(x1, x2, y, amp, color, width, alpha) {
      const len = Math.max(8, x2 - x1);
      const coils = Math.max(6, Math.round(len / 13));
      const step = len / coils;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y);
      for (let i = 0; i < coils; i++) {
        const dir = i % 2 === 0 ? 1 : -1;
        ctx.lineTo(x1 + step * (i + 0.5), y + amp * dir);
        ctx.lineTo(x1 + step * (i + 1), y);
      }
      ctx.stroke();
      ctx.restore();
    }
    function drawDim(x0, x1, y, color, label, alpha) {
      if (Math.abs(x1 - x0) < 2) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(x0, y - 5); ctx.lineTo(x0, y + 5);
      ctx.moveTo(x1, y - 5); ctx.lineTo(x1, y + 5);
      ctx.moveTo(x0, y); ctx.lineTo(x1, y);
      ctx.stroke();
      ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText(label, (x0 + x1) / 2, y - 6);
      ctx.restore();
    }
    function drawBlockAt(x, y, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      const s = BLOCK * 2;
      ctx.beginPath();
      ctx.roundRect(x - BLOCK, y - BLOCK, s, s, 6);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = "#292929";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    function draw() {
      ctx.clearRect(0, 0, cssW, cssH);
      ctx.fillStyle = "#fafafa";
      ctx.fillRect(0, 0, cssW, cssH);
      ctx.strokeStyle = "rgba(41,41,41,0.12)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(0, cy + BLOCK + 4);
      ctx.lineTo(cssW, cy + BLOCK + 4);
      ctx.stroke();
      ctx.setLineDash([]);
      drawWall();
      const disp = displacement();
      const kEq = keq();
      const x1 = disp * k2 / (k1 + k2);
      const x2 = disp * k1 / (k1 + k2);
      const L1 = L0 * 0.5, L2 = L0 * 0.5;
      const springStart = wallX + WALL_W;
      const jx = springStart + L1 + x1;
      const end2 = ballX - BLOCK;
      const ghostDisp = disp * kEq / k1;
      const ghostX = restX + ghostDisp;
      const amp = cssW < 360 ? 7 : 9;
      const active = Math.abs(disp) > 2 || Math.abs(v) > 3 || dragging;
      drawCoil(springStart, ghostX - BLOCK, cy, amp * 0.85, "#292929", 1.6, 0.18);
      drawBlockAt(ghostX, cy, "#292929", 0.12);
      drawCoil(springStart, jx - JUNC_R, cy, amp, active ? "#8043f0" : "#292929", 2.3, 1);
      ctx.beginPath();
      ctx.arc(jx, cy, JUNC_R, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.strokeStyle = "#292929";
      ctx.lineWidth = 1.6;
      ctx.stroke();
      drawCoil(jx + JUNC_R, end2, cy, amp, active ? "#8043f0" : "#292929", 2.3, 1);
      drawBlockAt(ballX, cy, active ? "#8043f0" : "#292929", 1);
      ctx.strokeStyle = "rgba(41,41,41,0.28)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(restX, cy - BLOCK - 8);
      ctx.lineTo(restX, cy + BLOCK + 36);
      ctx.stroke();
      ctx.setLineDash([]);
      drawDim(restX, ghostX, cy + BLOCK + 22, "#292929", "Δx (k₁)", 0.35);
      drawDim(restX, ballX, cy + BLOCK + 40, "#8043f0", "Δx serie", 0.95);
      ctx.fillStyle = "rgba(41,41,41,0.5)";
      ctx.font = "600 9px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("k₁", (springStart + jx) / 2 - 6, cy - amp - 8);
      ctx.fillText("k₂", (jx + end2) / 2 - 6, cy - amp - 8);
      ctx.fillStyle = "rgba(41,41,41,0.45)";
      ctx.textAlign = "center";
      ctx.fillText("Trage cubul — seria e mai moale: Δx mai mare decât un singur k₁", cssW * 0.5, cssH - 10);
    }
    canvas.addEventListener("pointerdown", (e) => {
      if (paused) return;
      const p = ptr(e);
      if (!hitBlock(p)) return;
      dragging = true; v = 0; pointerId = e.pointerId;
      canvas.classList.add("dragging");
      canvas.setPointerCapture(e.pointerId);
      postState();
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!dragging || e.pointerId !== pointerId) return;
      ballX = Math.max(minBallX(), Math.min(maxBallX(), ptr(e).x));
    });
    canvas.addEventListener("pointerup", (e) => {
      if (e.pointerId !== pointerId) return;
      dragging = false; pointerId = null;
      canvas.classList.remove("dragging");
      canvas.releasePointerCapture(e.pointerId);
      postState();
    });
    canvas.addEventListener("pointercancel", (e) => {
      if (e.pointerId !== pointerId) return;
      dragging = false; pointerId = null;
      canvas.classList.remove("dragging");
    });
    function syncK() {
      document.getElementById("k1Val").textContent = k1;
      document.getElementById("k2Val").textContent = k2;
      document.getElementById("keqVal").textContent = fmtKeq();
      postState();
    }
    document.getElementById("k1").addEventListener("input", (e) => { k1 = Number(e.target.value); syncK(); });
    document.getElementById("k2").addEventListener("input", (e) => { k2 = Number(e.target.value); syncK(); });
    let last = performance.now();
    function loop(now) {
      update(Math.min(0.032, (now - last) / 1000));
      last = now;
      draw();
      requestAnimationFrame(loop);
    }
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "learning-path-simulation-set-paused" || d.type === "trajectory-simulation-set-paused") paused = Boolean(d.paused);
    });
    new ResizeObserver(resize).observe(canvas.parentElement);
    resize();
    ballX = restX;
    postState();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
