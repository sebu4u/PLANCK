<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Resorturi în paralel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --text: #292929; --line: #e8e8ec; --accent: #8043f0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; }
    .sim { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
    .controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 2px; }
    .row { display: flex; align-items: center; gap: 6px; flex: 1 1 110px; min-width: 0; }
    .row label { font: 600 10px ui-sans-serif, system-ui, sans-serif; white-space: nowrap; }
    .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; }
    .val { font: 700 10px ui-sans-serif, system-ui, sans-serif; color: var(--accent); min-width: 32px; text-align: right; }
    .stage { flex: 1 1 auto; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(180deg, #fff 0%, #fbfbfb 100%); }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    @media (max-width: 520px) {
      .row { min-height: 32px; flex: 1 1 100%; }
      .row input[type=range] { height: 28px; }
      .stage { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="sim">
    <div class="controls">
      <div class="row"><label for="k1">k₁</label><input id="k1" type="range" min="20" max="300" step="5" value="90"><span class="val" id="k1Val">90</span></div>
      <div class="row"><label for="k2">k₂</label><input id="k2" type="range" min="20" max="300" step="5" value="90"><span class="val" id="k2Val">90</span></div>
      <div class="row"><label>k<sub>eq</sub></label><span class="val" id="keqVal">180</span></div>
    </div>
    <section class="stage"><canvas id="canvas"></canvas></section>
  </main>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const MASS = 1, BALL_R = 20, DAMPING = 5.5, RESTITUTION = 0.42, GPIX = 6200, CEIL_H = 12;
    let cssW = 0, cssH = 0, dpr = 1, paused = false;
    let k1 = 90, k2 = 90;
    let cx = 0, ceilY = 0, attachY = 0, L0 = 0, restY = 0;
    let massY = 0, v = 0;
    let dragging = false, pointerId = null;

    function keq() { return k1 + k2; }
    function sag(k) { return MASS * GPIX / Math.max(20, k); }
    function layout() {
      cx = cssW * 0.42;
      ceilY = cssH * 0.08;
      attachY = ceilY + CEIL_H;
      L0 = Math.min(cssH * 0.28, 92);
      restY = attachY + L0 + BALL_R + sag(keq());
    }
    function minY() { return attachY + L0 * 0.45 + BALL_R; }
    function maxY() { return Math.min(cssH - BALL_R - 28, attachY + L0 * 2.1 + BALL_R); }
    function unstretchedY() { return attachY + L0 + BALL_R; }
    function stretch() { return massY - unstretchedY(); }
    function fmtKeq() { return String(Math.round(keq())); }
    function postState() {
      window.parent.postMessage({
        type: "learning-path-simulation-state",
        name: "Resorturi în paralel",
        text: dragging ? "Trage masa — paralela e mai rigidă decât un singur k₁." : "k_eq = k₁+k₂ — Δx mai mic decât un singur k₁.",
        paused
      }, "*");
    }
    function resize() {
      const r = canvas.getBoundingClientRect();
      cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(cssW * dpr); canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const rel = L0 > 0 ? (massY - restY) / L0 : 0;
      layout();
      massY = Math.max(minY(), Math.min(maxY(), restY + rel * L0));
    }
    function ptr(e) {
      const rec = canvas.getBoundingClientRect();
      return { x: e.clientX - rec.left, y: e.clientY - rec.top };
    }
    function hitMass(p) { return Math.hypot(p.x - cx, p.y - massY) <= BALL_R + 14; }
    function update(dt) {
      if (paused || dragging) return;
      const st = stretch();
      const a = (-keq() * st + MASS * GPIX - DAMPING * v) / MASS;
      v += a * dt;
      massY += v * dt;
      if (massY < minY()) { massY = minY(); v = Math.abs(v) * RESTITUTION; }
      else if (massY > maxY()) { massY = maxY(); v = -Math.abs(v) * RESTITUTION; }
      if (Math.abs(massY - restY) < 0.35 && Math.abs(v) < 0.5) { v = 0; massY = restY; }
    }
    function drawCeiling() {
      const left = cssW * 0.16, w = cssW * 0.52;
      ctx.fillStyle = "#292929";
      ctx.fillRect(left, ceilY, w, CEIL_H);
      ctx.fillStyle = "rgba(41,41,41,0.1)";
      for (let x = left; x < left + w; x += 16) {
        ctx.save();
        ctx.translate(x, ceilY);
        ctx.rotate(-0.75);
        ctx.fillRect(0, -11, 2, 12);
        ctx.restore();
      }
    }
    function drawCoilV(x, y1, y2, amp, color, width, alpha) {
      const len = Math.max(8, y2 - y1);
      const coils = Math.max(6, Math.round(len / 13));
      const step = len / coils;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(x, y1);
      for (let i = 0; i < coils; i++) {
        const dir = i % 2 === 0 ? 1 : -1;
        ctx.lineTo(x + amp * dir, y1 + step * (i + 0.5));
        ctx.lineTo(x, y1 + step * (i + 1));
      }
      ctx.stroke();
      ctx.restore();
    }
    function drawBall(x, y, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(x, y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = "#292929";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    function drawDimV(y0, y1, x, color, label, alpha) {
      if (Math.abs(y1 - y0) < 2) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(x - 5, y0); ctx.lineTo(x + 5, y0);
      ctx.moveTo(x - 5, y1); ctx.lineTo(x + 5, y1);
      ctx.moveTo(x, y0); ctx.lineTo(x, y1);
      ctx.stroke();
      ctx.save();
      ctx.translate(x + 10, (y0 + y1) / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, 0, 0);
      ctx.restore();
      ctx.restore();
    }
    function draw() {
      ctx.clearRect(0, 0, cssW, cssH);
      ctx.fillStyle = "#fafafa";
      ctx.fillRect(0, 0, cssW, cssH);
      drawCeiling();
      const off = Math.min(28, cssW * 0.06);
      const st = stretch();
      const ghostSt = st * keq() / k1;
      const ghostY = Math.min(maxY() + 8, unstretchedY() + ghostSt);
      const amp = cssW < 360 ? 7 : 9;
      const active = Math.abs(massY - restY) > 2 || Math.abs(v) > 3 || dragging;
      const topM = massY - BALL_R;
      const topG = ghostY - BALL_R;
      drawCoilV(cx, attachY, topG, amp * 0.9, "#292929", 1.6, 0.18);
      drawBall(cx, ghostY, "#292929", 0.12);
      drawCoilV(cx - off, attachY, topM, amp, active ? "#8043f0" : "#292929", 2.3, 1);
      drawCoilV(cx + off, attachY, topM, amp, active ? "#8043f0" : "#292929", 2.3, 1);
      drawBall(cx, massY, active ? "#8043f0" : "#292929", 1);
      ctx.fillStyle = "rgba(41,41,41,0.5)";
      ctx.font = "600 9px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("k₁", cx - off, attachY + 14);
      ctx.fillText("k₂", cx + off, attachY + 14);
      const dimX = cx + off + BALL_R + 22;
      const y0 = unstretchedY();
      drawDimV(y0, ghostY, dimX + 18, "#292929", "Δx (k₁)", 0.35);
      drawDimV(y0, massY, dimX, "#8043f0", "Δx paralel", 0.95);
      ctx.strokeStyle = "rgba(41,41,41,0.28)";
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(cx - 50, y0);
      ctx.lineTo(cx + 70, y0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(41,41,41,0.45)";
      ctx.font = "600 9px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("Trage masa — în paralel e mai rigid: Δx mai mic decât un singur k₁", cssW * 0.5, cssH - 10);
    }
    canvas.addEventListener("pointerdown", (e) => {
      if (paused) return;
      if (!hitMass(ptr(e))) return;
      dragging = true; v = 0; pointerId = e.pointerId;
      canvas.classList.add("dragging");
      canvas.setPointerCapture(e.pointerId);
      postState();
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!dragging || e.pointerId !== pointerId) return;
      massY = Math.max(minY(), Math.min(maxY(), ptr(e).y));
    });
    canvas.addEventListener("pointerup", (e) => {
      if (e.pointerId !== pointerId) return;
      dragging = false; pointerId = null;
      canvas.classList.remove("dragging");
      canvas.releasePointerCapture(e.pointerId);
      postState();
    });
    canvas.addEventListener("pointercancel", (e) => {
      if (e.pointerId !== pointerId) return;
      dragging = false; pointerId = null;
      canvas.classList.remove("dragging");
    });
    function syncK() {
      document.getElementById("k1Val").textContent = k1;
      document.getElementById("k2Val").textContent = k2;
      document.getElementById("keqVal").textContent = fmtKeq();
      layout();
      if (!dragging) massY = restY;
      postState();
    }
    document.getElementById("k1").addEventListener("input", (e) => { k1 = Number(e.target.value); syncK(); });
    document.getElementById("k2").addEventListener("input", (e) => { k2 = Number(e.target.value); syncK(); });
    let last = performance.now();
    function loop(now) {
      update(Math.min(0.032, (now - last) / 1000));
      last = now;
      draw();
      requestAnimationFrame(loop);
    }
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "learning-path-simulation-set-paused" || d.type === "trajectory-simulation-set-paused") paused = Boolean(d.paused);
    });
    new ResizeObserver(resize).observe(canvas.parentElement);
    resize();
    massY = restY;
    postState();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
