<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Spectrul luminii</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --text: #292929; --line: #e8e8ec; --accent: #8043f0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; }
    .sim { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
    .controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 2px; }
    .row { display: flex; align-items: center; gap: 6px; flex: 1 1 140px; min-width: 0; }
    .row label { font: 600 10px ui-sans-serif, system-ui, sans-serif; white-space: nowrap; }
    .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; }
    .val { font: 700 10px ui-sans-serif, system-ui, sans-serif; color: var(--accent); min-width: 88px; text-align: right; }
    .stage { flex: 1 1 auto; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(180deg, #fff 0%, #fbfbfb 100%); }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    @media (max-width: 520px) {
      .row { min-height: 32px; flex: 1 1 100%; }
      .row input[type=range] { height: 28px; }
      .stage { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="sim">
    <div class="controls">
      <div class="row"><label for="wl">λ</label><input id="wl" type="range" min="400" max="700" step="1" value="550"><span class="val" id="wlVal">550 nm · verde</span></div>
    </div>
    <section class="stage"><canvas id="canvas"></canvas></section>
  </main>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let cssW = 0, cssH = 0, dpr = 1, paused = false;
    let wl = 550;

    function colorName(l) {
      if (l < 450) return "violet";
      if (l < 495) return "albastru";
      if (l < 570) return "verde";
      if (l < 590) return "galben";
      if (l < 620) return "portocaliu";
      return "roșu";
    }
    function wlRgb(l, a) {
      let r = 0, g = 0, b = 0;
      if (l < 440) { r = -(l - 440) / 40; b = 1; }
      else if (l < 490) { g = (l - 440) / 50; b = 1; }
      else if (l < 510) { g = 1; b = -(l - 510) / 20; }
      else if (l < 580) { r = (l - 510) / 70; g = 1; }
      else if (l < 645) { r = 1; g = -(l - 645) / 65; }
      else { r = 1; }
      let s = 1;
      if (l < 420) s = 0.45 + 0.55 * (l - 400) / 20;
      if (l > 680) s = 0.55 + 0.45 * (700 - l) / 20;
      return "rgba(" + Math.round(r * 255 * s) + "," + Math.round(g * 255 * s) + "," + Math.round(b * 255 * s) + "," + (a == null ? 1 : a) + ")";
    }
    function postState() {
      window.parent.postMessage({
        type: "learning-path-simulation-state",
        name: "Spectrul luminii",
        text: "Lumina albă e un amestec. Prisma separă λ = " + wl + " nm (" + colorName(wl) + ").",
        paused
      }, "*");
    }
    function resize() {
      const r = canvas.getBoundingClientRect();
      cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(cssW * dpr); canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function prismPts() {
      const cx = cssW * 0.42, cy = cssH * 0.40;
      const s = Math.min(cssW, cssH) * 0.28;
      return {
        a: { x: cx, y: cy - s * 0.62 },
        b: { x: cx - s * 0.58, y: cy + s * 0.48 },
        c: { x: cx + s * 0.58, y: cy + s * 0.48 },
        hit: { x: cx - s * 0.29, y: cy - s * 0.07 },
        exit: { x: cx + s * 0.29, y: cy - s * 0.07 }
      };
    }
    function exitDir(l) {
      const t = (l - 400) / 300;
      const ang = 0.12 + (1 - t) * 0.42;
      return { x: Math.cos(ang), y: Math.sin(ang) };
    }
    function draw() {
      ctx.clearRect(0, 0, cssW, cssH);
      ctx.fillStyle = "#fafafa";
      ctx.fillRect(0, 0, cssW, cssH);
      const P = prismPts();
      ctx.beginPath();
      ctx.moveTo(8, P.hit.y);
      ctx.lineTo(P.hit.x, P.hit.y);
      ctx.strokeStyle = "rgba(41,41,41,0.55)";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(8, P.hit.y);
      ctx.lineTo(P.hit.x, P.hit.y);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.4;
      ctx.stroke();
      ctx.fillStyle = "rgba(41,41,41,0.5)";
      ctx.font = "600 10px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("lumină albă", 10, P.hit.y - 10);
      ctx.beginPath();
      ctx.moveTo(P.hit.x, P.hit.y);
      ctx.lineTo(P.exit.x, P.exit.y);
      ctx.strokeStyle = "rgba(41,41,41,0.28)";
      ctx.lineWidth = 2;
      ctx.stroke();
      const reach = Math.max(cssW, cssH);
      for (let l = 400; l <= 700; l += 4) {
        const d = exitDir(l);
        ctx.beginPath();
        ctx.moveTo(P.exit.x, P.exit.y);
        ctx.lineTo(P.exit.x + d.x * reach, P.exit.y + d.y * reach);
        ctx.strokeStyle = wlRgb(l, 0.55);
        ctx.lineWidth = 3.2;
        ctx.stroke();
      }
      const hd = exitDir(wl);
      ctx.beginPath();
      ctx.moveTo(P.exit.x, P.exit.y);
      ctx.lineTo(P.exit.x + hd.x * reach, P.exit.y + hd.y * reach);
      ctx.strokeStyle = wlRgb(wl, 1);
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(P.a.x, P.a.y);
      ctx.lineTo(P.b.x, P.b.y);
      ctx.lineTo(P.c.x, P.c.y);
      ctx.closePath();
      ctx.fillStyle = "rgba(180, 210, 230, 0.35)";
      ctx.fill();
      ctx.strokeStyle = "#8043f0";
      ctx.lineWidth = 2;
      ctx.stroke();
      const lx = P.exit.x + hd.x * Math.min(cssW * 0.28, 110);
      const ly = P.exit.y + hd.y * Math.min(cssW * 0.28, 110);
      ctx.fillStyle = "#292929";
      ctx.font = "700 12px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(wl + " nm  ·  " + colorName(wl), lx + 8, ly);
      const barX = cssW * 0.08, barW = cssW * 0.84, barY = cssH * 0.82, barH = 16;
      const grd = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      for (let i = 0; i <= 12; i++) {
        const l = 400 + i * 25;
        grd.addColorStop(i / 12, wlRgb(l, 1));
      }
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, barH, 8);
      ctx.fill();
      ctx.strokeStyle = "rgba(41,41,41,0.25)";
      ctx.lineWidth = 1;
      ctx.stroke();
      const mx = barX + ((wl - 400) / 300) * barW;
      ctx.beginPath();
      ctx.moveTo(mx, barY - 4);
      ctx.lineTo(mx, barY + barH + 4);
      ctx.strokeStyle = "#292929";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mx, barY + barH / 2, 5, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.strokeStyle = "#292929";
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.fillStyle = "rgba(41,41,41,0.45)";
      ctx.font = "600 9px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("400 nm", barX, barY + barH + 14);
      ctx.textAlign = "right";
      ctx.fillText("700 nm", barX + barW, barY + barH + 14);
      ctx.textAlign = "center";
      ctx.fillText("Lumina albă e un amestec; prisma separă lungimile de undă", cssW * 0.5, cssH - 8);
    }
    document.getElementById("wl").addEventListener("input", (e) => {
      wl = Number(e.target.value);
      document.getElementById("wlVal").textContent = wl + " nm · " + colorName(wl);
      postState();
    });
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "learning-path-simulation-set-paused" || d.type === "trajectory-simulation-set-paused") paused = Boolean(d.paused);
    });
    new ResizeObserver(resize).observe(canvas.parentElement);
    resize();
    postState();
    (function loop() { draw(); requestAnimationFrame(loop); })();
  </script>
</body>
</html>
