<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lucrul mecanic și unghiul</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --text: #292929; --line: #e8e8ec; --accent: #8043f0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; }
    .sim { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
    .controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 2px; }
    .row { display: flex; align-items: center; gap: 6px; flex: 1 1 110px; min-width: 0; }
    .row label { font: 600 10px ui-sans-serif, system-ui, sans-serif; white-space: nowrap; }
    .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; }
    .val { font: 700 10px ui-sans-serif, system-ui, sans-serif; color: var(--accent); min-width: 44px; text-align: right; }
    .stage { flex: 1 1 auto; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(180deg, #fff 0%, #fbfbfb 100%); }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    @media (max-width: 520px) {
      .row { min-height: 32px; flex: 1 1 100%; }
      .row input[type=range] { height: 28px; }
      .stage { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="sim">
    <div class="controls">
      <div class="row"><label for="alpha">α</label><input id="alpha" type="range" min="0" max="180" step="1" value="40"><span class="val" id="aVal">40°</span></div>
      <div class="row"><label>F cos α</label><span class="val" id="fcVal">7.7 N</span></div>
      <div class="row"><label>L</label><span class="val" id="lVal">15.3 J</span></div>
    </div>
    <section class="stage"><canvas id="canvas"></canvas></section>
  </main>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const F = 10, S = 2;
    let cssW = 0, cssH = 0, dpr = 1, paused = false;
    let alpha = 40;

    function rad() { return alpha * Math.PI / 180; }
    function fcos() { return F * Math.cos(rad()); }
    function work() { return F * S * Math.cos(rad()); }
    function workColor() {
      const L = work();
      if (Math.abs(L) < 0.15) return "#888888";
      return L > 0 ? "#2ecc71" : "#e74c3c";
    }
    function postState() {
      const L = work();
      let hint = "L = 0 — forța e perpendiculară pe deplasare.";
      if (L > 0.15) hint = "L > 0 — forța ajută deplasarea.";
      else if (L < -0.15) hint = "L < 0 — forța se opune deplasării.";
      window.parent.postMessage({
        type: "learning-path-simulation-state",
        name: "Lucrul mecanic și unghiul",
        text: hint,
        paused
      }, "*");
    }
    function resize() {
      const r = canvas.getBoundingClientRect();
      cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(cssW * dpr); canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function drawArrow(x0, y0, x1, y1, color, width) {
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.hypot(dx, dy) || 1;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
      const ux = dx / len, uy = dy / len;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - ux * 11 - uy * 5.5, y1 - uy * 11 + ux * 5.5);
      ctx.lineTo(x1 - ux * 11 + uy * 5.5, y1 - uy * 11 - ux * 5.5);
      ctx.closePath();
      ctx.fill();
    }
    function syncVals() {
      document.getElementById("aVal").textContent = alpha + "°";
      document.getElementById("fcVal").textContent = fcos().toFixed(1) + " N";
      const el = document.getElementById("lVal");
      el.textContent = work().toFixed(1) + " J";
      el.style.color = workColor();
    }
    function draw() {
      ctx.clearRect(0, 0, cssW, cssH);
      ctx.fillStyle = "#fafafa";
      ctx.fillRect(0, 0, cssW, cssH);
      const ground = cssH * 0.72;
      const bw = Math.min(56, cssW * 0.14), bh = Math.min(40, cssH * 0.16);
      const bx = cssW * 0.28, by = ground - bh;
      ctx.fillStyle = "rgba(41,41,41,0.06)";
      ctx.fillRect(0, ground, cssW, cssH - ground);
      ctx.strokeStyle = "#292929";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cssW * 0.06, ground);
      ctx.lineTo(cssW * 0.94, ground);
      ctx.stroke();
      ctx.fillStyle = "rgba(41,41,41,0.08)";
      for (let x = cssW * 0.08; x < cssW * 0.92; x += 14) {
        ctx.save();
        ctx.translate(x, ground + 2);
        ctx.rotate(0.7);
        ctx.fillRect(0, 0, 2, 10);
        ctx.restore();
      }
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 8);
      ctx.fillStyle = "#292929";
      ctx.fill();
      const ox = bx + bw / 2, oy = by + bh / 2;
      const sLen = Math.min(cssW * 0.42, 160);
      drawArrow(bx + bw + 6, ground + 18, bx + bw + 6 + sLen, ground + 18, "#292929", 2);
      ctx.fillStyle = "#292929";
      ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("s = 2 m", bx + bw + 6 + sLen / 2, ground + 36);
      const fLen = Math.min(cssH * 0.38, 120);
      const a = rad();
      const fx = ox + Math.cos(a) * fLen;
      const fy = oy - Math.sin(a) * fLen;
      const px = ox + Math.cos(a) * fLen;
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "rgba(128,67,240,0.55)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(px, oy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px, oy);
      ctx.lineTo(fx, fy);
      ctx.stroke();
      ctx.setLineDash([]);
      if (Math.abs(px - ox) > 8) drawArrow(ox, oy, px, oy, "#8043f0", 2);
      drawArrow(ox, oy, fx, fy, "#8043f0", 2.8);
      if (alpha > 6 && alpha < 174) {
        ctx.strokeStyle = "#292929";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(ox, oy, 26, 0, -a, a > 0);
        ctx.stroke();
        ctx.fillStyle = "#292929";
        ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
        ctx.textAlign = "left";
        const mid = -a / 2;
        ctx.fillText("α = " + alpha + "°", ox + Math.cos(mid) * 36, oy + Math.sin(mid) * 36 - 2);
      }
      ctx.fillStyle = "#8043f0";
      ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("F = 10 N", fx, fy - 12);
      ctx.fillText("F cos α", (ox + px) / 2, oy + 14);
      const L = work();
      ctx.fillStyle = workColor();
      ctx.font = "700 16px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("L = " + L.toFixed(1) + " J", 12, 22);
      ctx.fillStyle = "rgba(41,41,41,0.45)";
      ctx.font = "600 9px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("L = F·s·cos α  —  semnul lucrului depinde de unghi", 12, 38);
      const barW = Math.min(160, cssW * 0.36), barH = 8;
      const bx0 = cssW - barW - 14, by0 = 16;
      ctx.fillStyle = "rgba(41,41,41,0.08)";
      ctx.fillRect(bx0, by0, barW, barH);
      const mid = bx0 + barW / 2;
      const fill = (L / 20) * (barW / 2);
      ctx.fillStyle = workColor();
      if (fill >= 0) ctx.fillRect(mid, by0, fill, barH);
      else ctx.fillRect(mid + fill, by0, -fill, barH);
      ctx.strokeStyle = "rgba(41,41,41,0.25)";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx0, by0, barW, barH);
      ctx.beginPath();
      ctx.moveTo(mid, by0 - 2);
      ctx.lineTo(mid, by0 + barH + 2);
      ctx.stroke();
      ctx.fillStyle = "rgba(41,41,41,0.45)";
      ctx.font = "600 8px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("−20 J", bx0, by0 + 20);
      ctx.textAlign = "right";
      ctx.fillText("+20 J", bx0 + barW, by0 + 20);
      ctx.textAlign = "center";
      ctx.fillText("F = 10 N, s = 2 m spre dreapta", cssW * 0.5, cssH - 10);
    }
    document.getElementById("alpha").addEventListener("input", (e) => {
      alpha = Number(e.target.value);
      syncVals();
      postState();
    });
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "learning-path-simulation-set-paused" || d.type === "trajectory-simulation-set-paused") paused = Boolean(d.paused);
    });
    new ResizeObserver(resize).observe(canvas.parentElement);
    resize();
    syncVals();
    postState();
    (function loop() { draw(); requestAnimationFrame(loop); })();
  </script>
</body>
</html>
