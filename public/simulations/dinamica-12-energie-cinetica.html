<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Energia cinetică</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --text: #292929; --line: #e8e8ec; --accent: #8043f0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; }
    .sim { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
    .controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 2px; }
    .row { display: flex; align-items: center; gap: 6px; flex: 1 1 110px; min-width: 0; }
    .row label { font: 600 10px ui-sans-serif, system-ui, sans-serif; white-space: nowrap; }
    .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; }
    .val { font: 700 10px ui-sans-serif, system-ui, sans-serif; color: var(--accent); min-width: 52px; text-align: right; }
    .stage { flex: 1 1 auto; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(180deg, #fff 0%, #fbfbfb 100%); }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    @media (max-width: 520px) {
      .row { min-height: 32px; flex: 1 1 100%; }
      .row input[type=range] { height: 28px; }
      .stage { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="sim">
    <div class="controls">
      <div class="row"><label for="v1">v₁</label><input id="v1" type="range" min="1" max="20" step="0.5" value="4"><span class="val" id="v1Val">4.0 m/s</span></div>
      <div class="row"><label for="v2">v₂</label><input id="v2" type="range" min="1" max="20" step="0.5" value="12"><span class="val" id="v2Val">12.0 m/s</span></div>
      <div class="row"><label>E<sub>c</sub></label><span class="val" id="eVal">8 / 72 J</span></div>
    </div>
    <section class="stage"><canvas id="canvas"></canvas></section>
  </main>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const MASS = 1, VMAX = 20, PX = 22;
    let cssW = 0, cssH = 0, dpr = 1, paused = false;
    let v1 = 4, v2 = 12, x1 = 40, x2 = 40;

    function ec(v) { return 0.5 * MASS * v * v; }
    function postState() {
      window.parent.postMessage({
        type: "learning-path-simulation-state",
        name: "Energia cinetică",
        text: "Ec ∝ v² — la v₂/v₁ = " + (v2 / v1).toFixed(1) + ", raportul energiilor e " + (ec(v2) / Math.max(0.01, ec(v1))).toFixed(1) + ".",
        paused
      }, "*");
    }
    function resize() {
      const r = canvas.getBoundingClientRect();
      cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(cssW * dpr); canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function syncVals() {
      document.getElementById("v1Val").textContent = v1.toFixed(1) + " m/s";
      document.getElementById("v2Val").textContent = v2.toFixed(1) + " m/s";
      document.getElementById("eVal").textContent = ec(v1).toFixed(0) + " / " + ec(v2).toFixed(0) + " J";
    }
    function update(dt) {
      if (paused) return;
      const left = 18, right = cssW - 18, span = Math.max(40, right - left);
      x1 = left + ((x1 - left + v1 * PX * dt) % span + span) % span;
      x2 = left + ((x2 - left + v2 * PX * dt) % span + span) % span;
    }
    function drawTrack(y) {
      ctx.strokeStyle = "rgba(41,41,41,0.18)";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(16, y + 14);
      ctx.lineTo(cssW - 16, y + 14);
      ctx.stroke();
      ctx.strokeStyle = "rgba(41,41,41,0.08)";
      ctx.lineWidth = 1;
      for (let x = 24; x < cssW - 20; x += 18) {
        ctx.beginPath();
        ctx.moveTo(x, y + 10);
        ctx.lineTo(x, y + 18);
        ctx.stroke();
      }
    }
    function drawTrail(x, y, v, color) {
      const n = Math.min(8, 2 + Math.round(v / 3));
      for (let i = 1; i <= n; i++) {
        ctx.globalAlpha = 0.07 * (n - i + 1) / n;
        ctx.beginPath();
        ctx.roundRect(x - v * 1.15 * i - 22, y - 22, 44, 22, 6);
        ctx.fillStyle = color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function drawCart(x, y, color, label) {
      const w = 44, h = 22;
      ctx.beginPath();
      ctx.roundRect(x - w / 2, y - h, w, h, 6);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = "#292929";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x - 12, y + 2, 5, 0, Math.PI * 2);
      ctx.arc(x + 12, y + 2, 5, 0, Math.PI * 2);
      ctx.fillStyle = "#292929";
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x, y - 8);
    }
    function drawBar(x, y, w, hMax, frac, color, label) {
      ctx.fillStyle = "rgba(41,41,41,0.06)";
      ctx.fillRect(x, y - hMax, w, hMax);
      ctx.strokeStyle = "rgba(41,41,41,0.18)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y - hMax, w, hMax);
      const fh = Math.max(2, frac * hMax);
      ctx.fillStyle = color;
      ctx.fillRect(x, y - fh, w, fh);
      ctx.fillStyle = color;
      ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x + w / 2, y - hMax - 6);
    }
    function draw() {
      ctx.clearRect(0, 0, cssW, cssH);
      ctx.fillStyle = "#fafafa";
      ctx.fillRect(0, 0, cssW, cssH);
      const y1 = cssH * 0.34, y2 = cssH * 0.62;
      drawTrack(y1);
      drawTrack(y2);
      drawTrail(x1, y1, v1, "#292929");
      drawTrail(x2, y2, v2, "#8043f0");
      drawCart(x1, y1, "#292929", "1");
      drawCart(x2, y2, "#8043f0", "2");
      ctx.fillStyle = "#292929";
      ctx.font = "600 10px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("v₁ = " + v1.toFixed(1) + " m/s   Ec₁ = " + ec(v1).toFixed(1) + " J", 14, y1 - 28);
      ctx.fillStyle = "#8043f0";
      ctx.fillText("v₂ = " + v2.toFixed(1) + " m/s   Ec₂ = " + ec(v2).toFixed(1) + " J", 14, y2 - 28);
      const eMax = 0.5 * MASS * VMAX * VMAX;
      const barW = 18, hMax = cssH * 0.28;
      const bx = cssW - 58;
      drawBar(bx - 22, cssH * 0.86, barW, hMax, ec(v1) / eMax, "#292929", "Ec₁");
      drawBar(bx + 4, cssH * 0.86, barW, hMax, ec(v2) / eMax, "#8043f0", "Ec₂");
      const ratio = ec(v2) / Math.max(0.01, ec(v1));
      ctx.fillStyle = "#8043f0";
      ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Ec₂ / Ec₁ = " + ratio.toFixed(1), 14, 20);
      ctx.fillStyle = "rgba(41,41,41,0.45)";
      ctx.font = "600 9px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("m = 1 kg (identică)  ·  Ec = ½ m v²", 14, 34);
      ctx.textAlign = "center";
      ctx.fillText("v² face energia celui rapid mult mai mare", cssW * 0.5, cssH - 10);
    }
    document.getElementById("v1").addEventListener("input", (e) => {
      v1 = Number(e.target.value); syncVals(); postState();
    });
    document.getElementById("v2").addEventListener("input", (e) => {
      v2 = Number(e.target.value); syncVals(); postState();
    });
    let last = performance.now();
    function loop(now) {
      update(Math.min(0.032, (now - last) / 1000));
      last = now;
      draw();
      requestAnimationFrame(loop);
    }
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "learning-path-simulation-set-paused" || d.type === "trajectory-simulation-set-paused") paused = Boolean(d.paused);
    });
    new ResizeObserver(resize).observe(canvas.parentElement);
    resize();
    syncVals();
    postState();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
