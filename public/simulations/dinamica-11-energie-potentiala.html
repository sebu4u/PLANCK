<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Energia potențială gravitațională</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --text: #292929; --line: #e8e8ec; --accent: #8043f0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; }
    .sim { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
    .controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 2px; }
    .row { display: flex; align-items: center; gap: 6px; flex: 1 1 110px; min-width: 0; }
    .row label { font: 600 10px ui-sans-serif, system-ui, sans-serif; white-space: nowrap; }
    .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; }
    .val { font: 700 10px ui-sans-serif, system-ui, sans-serif; color: var(--accent); min-width: 44px; text-align: right; }
    .stage { flex: 1 1 auto; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(180deg, #fff 0%, #fbfbfb 100%); }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    @media (max-width: 520px) {
      .row { min-height: 32px; flex: 1 1 100%; }
      .row input[type=range] { height: 28px; }
      .stage { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="sim">
    <div class="controls">
      <div class="row"><label for="h">h</label><input id="h" type="range" min="0.5" max="8" step="0.1" value="3"><span class="val" id="hVal">3.0 m</span></div>
      <div class="row"><label for="m">m</label><input id="m" type="range" min="0.5" max="5" step="0.1" value="2"><span class="val" id="mVal">2.0 kg</span></div>
      <div class="row"><label>E<sub>pg</sub></label><span class="val" id="eVal">60 J</span></div>
    </div>
    <section class="stage"><canvas id="canvas"></canvas></section>
  </main>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const G = 10, HMAX = 8, EMAX = 5 * G * HMAX;
    let cssW = 0, cssH = 0, dpr = 1, paused = false;
    let h = 3, m = 2;

    function epg() { return m * G * h; }
    function postState() {
      window.parent.postMessage({
        type: "learning-path-simulation-state",
        name: "Energia potențială gravitațională",
        text: "Epg = m·g·h = " + epg().toFixed(1) + " J. Mai sus sau mai greu → mai multă energie stocată.",
        paused
      }, "*");
    }
    function resize() {
      const r = canvas.getBoundingClientRect();
      cssW = Math.max(1, r.width); cssH = Math.max(1, r.height);
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(cssW * dpr); canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function syncVals() {
      document.getElementById("hVal").textContent = h.toFixed(1) + " m";
      document.getElementById("mVal").textContent = m.toFixed(1) + " kg";
      document.getElementById("eVal").textContent = epg().toFixed(0) + " J";
    }
    function draw() {
      ctx.clearRect(0, 0, cssW, cssH);
      ctx.fillStyle = "#fafafa";
      ctx.fillRect(0, 0, cssW, cssH);
      const ground = cssH * 0.86;
      const maxPx = cssH * 0.68;
      const massR = 10 + m * 4.2;
      const mx = cssW * 0.34;
      const my = ground - (h / HMAX) * maxPx - massR;
      ctx.fillStyle = "rgba(41,41,41,0.06)";
      ctx.fillRect(0, ground, cssW, cssH - ground);
      ctx.strokeStyle = "#292929";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cssW * 0.06, ground);
      ctx.lineTo(cssW * 0.62, ground);
      ctx.stroke();
      ctx.fillStyle = "rgba(41,41,41,0.08)";
      for (let x = cssW * 0.08; x < cssW * 0.6; x += 14) {
        ctx.save();
        ctx.translate(x, ground + 2);
        ctx.rotate(0.7);
        ctx.fillRect(0, 0, 2, 10);
        ctx.restore();
      }
      ctx.fillStyle = "rgba(41,41,41,0.45)";
      ctx.font = "600 9px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("sol (h = 0)", cssW * 0.08, ground + 14);
      ctx.strokeStyle = "rgba(41,41,41,0.12)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 5]);
      for (let tick = 2; tick <= 8; tick += 2) {
        const ty = ground - (tick / HMAX) * maxPx;
        ctx.beginPath();
        ctx.moveTo(cssW * 0.08, ty);
        ctx.lineTo(cssW * 0.6, ty);
        ctx.stroke();
        ctx.fillStyle = "rgba(41,41,41,0.35)";
        ctx.font = "600 8px ui-sans-serif, system-ui, sans-serif";
        ctx.fillText(tick + " m", cssW * 0.08, ty - 3);
      }
      ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(41,41,41,0.28)";
      ctx.lineWidth = 1.3;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(mx - massR - 18, my + massR);
      ctx.lineTo(mx - massR - 18, ground);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(mx - massR - 24, my + massR);
      ctx.lineTo(mx - massR - 12, my + massR);
      ctx.moveTo(mx - massR - 24, ground);
      ctx.lineTo(mx - massR - 12, ground);
      ctx.stroke();
      ctx.fillStyle = "#292929";
      ctx.font = "700 11px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("h = " + h.toFixed(1) + " m", mx - massR - 28, (my + massR + ground) / 2 + 4);
      ctx.setLineDash([3, 4]);
      ctx.strokeStyle = "rgba(128,67,240,0.35)";
      ctx.beginPath();
      ctx.moveTo(mx, my + massR);
      ctx.lineTo(mx, ground);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(mx, my, massR, 0, Math.PI * 2);
      ctx.fillStyle = "#8043f0";
      ctx.fill();
      ctx.strokeStyle = "#292929";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = "700 10px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(m.toFixed(1) + " kg", mx, my + 4);
      const barX = cssW * 0.72, barW = Math.min(36, cssW * 0.08);
      const barBottom = ground, barTop = ground - maxPx;
      const e = epg();
      const fillH = (e / EMAX) * maxPx;
      ctx.fillStyle = "rgba(41,41,41,0.06)";
      ctx.fillRect(barX, barTop, barW, maxPx);
      ctx.strokeStyle = "rgba(41,41,41,0.2)";
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barTop, barW, maxPx);
      ctx.fillStyle = "#8043f0";
      ctx.fillRect(barX, barBottom - fillH, barW, fillH);
      ctx.strokeStyle = "rgba(41,41,41,0.2)";
      ctx.lineWidth = 1;
      for (let j = 100; j < EMAX; j += 100) {
        const ty = barBottom - (j / EMAX) * maxPx;
        ctx.beginPath();
        ctx.moveTo(barX, ty);
        ctx.lineTo(barX + barW, ty);
        ctx.stroke();
      }
      ctx.fillStyle = "#8043f0";
      ctx.font = "700 12px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Epg = " + e.toFixed(0) + " J", barX + barW + 8, barBottom - fillH - 4);
      ctx.fillStyle = "rgba(41,41,41,0.45)";
      ctx.font = "600 9px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("Epg = m·g·h", barX + barW + 8, barBottom - fillH + 12);
      ctx.fillText("g = 10 N/kg", barX + barW + 8, 22);
      ctx.textAlign = "center";
      ctx.fillText("Mai sus sau mai greu = mai multă energie stocată", cssW * 0.5, cssH - 10);
    }
    document.getElementById("h").addEventListener("input", (e) => {
      h = Number(e.target.value); syncVals(); postState();
    });
    document.getElementById("m").addEventListener("input", (e) => {
      m = Number(e.target.value); syncVals(); postState();
    });
    window.addEventListener("message", (e) => {
      const d = e.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "learning-path-simulation-set-paused" || d.type === "trajectory-simulation-set-paused") paused = Boolean(d.paused);
    });
    new ResizeObserver(resize).observe(canvas.parentElement);
    resize();
    syncVals();
    postState();
    (function loop() { draw(); requestAnimationFrame(loop); })();
  </script>
</body>
</html>
